version: CANONICAL_STATE_REGISTRY_v1.0
release: MathGov_v12.4
canonical_tokens:
  rg: [RG_SUPPORTED, RG_NARROWED, RG_REFUSED]
  rf: [RF_PASS, RF_FAIL, RF_ESCALATE, RF_NOT_EVALUATED_AFTER_PRIOR_FAILURE]
  trc: [TRC_PASS, TRC_NOT_TRIGGERED, TRC_FAIL, TRC_ESCALATE, TRC_EMERGENCY_PROVISIONAL, TRC_NOT_EVALUATED_AFTER_PRIOR_FAILURE]
  csv: [CSV_PASS, CSV_PASS_WITH_CONTROLS, CSV_NOT_MATERIAL, CSV_REDESIGN_REQUIRED, CSV_ESCALATE, CSV_FAIL, CSV_EMERGENCY_PROVISIONAL, CSV_NOT_EVALUATED_AFTER_PRIOR_FAILURE]
  final: [SELECTED_DECISIVE, SELECTED_BY_AUTHORITY_NON_DECISIVE, PROVISIONAL_WITH_CONTROLS, EMERGENCY_PROVISIONAL, NO_SELECTABLE_OPTION, REFUSED_UNDERDETERMINED, ESCALATED, DEFERRED]
deprecated_input_aliases:
  CSV_REDESIGN:
    normalize_to: CSV_REDESIGN_REQUIRED
    warning: CSV_REDESIGN is deprecated and must not be emitted by v12.4 systems.
