version: CANONICAL_STATE_REGISTRY_v1.0
release: MathGov_v12.6
canonical_tokens:
  rg:
  - RG_SUPPORTED
  - RG_NARROWED
  - RG_REFUSED
  rf:
  - RF_PASS
  - RF_FAIL
  - RF_ESCALATE
  - NCRC_UNKNOWN
  - RF_NOT_EVALUATED_AFTER_PRIOR_FAILURE
  trc:
  - TRC_PASS
  - TRC_NOT_TRIGGERED
  - TRC_FAIL
  - TRC_ESCALATE
  - TRC_EMERGENCY_PROVISIONAL
  - TRC_NOT_EVALUATED_AFTER_PRIOR_FAILURE
  csv:
  - CSV_PASS
  - CSV_PASS_WITH_CONTROLS
  - CSV_NOT_MATERIAL
  - CSV_REDESIGN_REQUIRED
  - CSV_ESCALATE
  - CSV_FAIL
  - CSV_EMERGENCY_PROVISIONAL
  - CSV_NOT_EVALUATED_AFTER_PRIOR_FAILURE
  final:
  - SELECTED_DECISIVE
  - SELECTED_BY_AUTHORITY_NON_DECISIVE
  - PROVISIONAL_WITH_CONTROLS
  - DELAY
  - REDESIGN
  - ESCALATE
  - REFUSE
  - NO_SELECTABLE_OPTION
  - EMERGENCY_PROVISIONAL
deprecated_input_aliases:
  CSV_REDESIGN:
    normalize_to: CSV_REDESIGN_REQUIRED
    warning: CSV_REDESIGN is deprecated and must not be emitted by v12.6 systems.
framework_verdict_crosswalk:
  ALLOW_FRAMEWORK_SELECTION: SELECTED_DECISIVE
  REFUSE_DETERMINISTIC_SELECTION+AUTHORITY_SELECTION: SELECTED_BY_AUTHORITY_NON_DECISIVE
  BINDING_CONTROLS: PROVISIONAL_WITH_CONTROLS
  TAIL_OR_CSV_EMERGENCY_PROVISIONAL: EMERGENCY_PROVISIONAL
  EMPTY_SELECTABLE_SET: NO_SELECTABLE_OPTION
  UNDERDETERMINED_OR_INSUFFICIENT_GROUNDING: REFUSE
  REDESIGN_REQUIRED: REDESIGN
  EVIDENCE_OR_AUTHORITY_ESCALATION: ESCALATE
  GOVERNED_TEMPORAL_DEFERRAL: DELAY
