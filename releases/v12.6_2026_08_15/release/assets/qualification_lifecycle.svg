<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">MathGov action qualification lifecycle</title>
  <desc id="desc">Six ordered stages from qualification through requalification, with mismatch and material triggers blocking or reopening the affected stages.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#123b5d"/>
      <stop offset="1" stop-color="#2f6f9f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6f9f"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a33a3a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#163047" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1400" height="430" rx="26" fill="#f5f8fb"/>
  <text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#123b5d">Action-bound governance lifecycle</text>
  <text x="70" y="92" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#425466">Qualification supports execution only when the exact action, configuration, controls, and separate authority remain current.</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(55 142)">
      <rect width="190" height="116" rx="18" fill="url(#blue)"/>
      <text x="95" y="48" font-size="22" font-weight="700" fill="white">1. QUALIFY</text>
      <text x="95" y="78" font-size="15" fill="#eaf4fb">Five-stage result</text>
      <text x="95" y="99" font-size="15" fill="#eaf4fb">remains admissible</text>
    </g>
    <g transform="translate(275 142)">
      <rect width="190" height="116" rx="18" fill="url(#blue)"/>
      <text x="95" y="48" font-size="22" font-weight="700" fill="white">2. BIND</text>
      <text x="95" y="78" font-size="15" fill="#eaf4fb">Exact action +</text>
      <text x="95" y="99" font-size="15" fill="#eaf4fb">configuration hashes</text>
    </g>
    <g transform="translate(495 142)">
      <rect width="190" height="116" rx="18" fill="url(#blue)"/>
      <text x="95" y="48" font-size="22" font-weight="700" fill="white">3. AUTHORIZE</text>
      <text x="95" y="78" font-size="15" fill="#eaf4fb">Distinct accountable</text>
      <text x="95" y="99" font-size="15" fill="#eaf4fb">authority basis</text>
    </g>
    <g transform="translate(715 142)">
      <rect width="190" height="116" rx="18" fill="url(#blue)"/>
      <text x="95" y="48" font-size="22" font-weight="700" fill="white">4. ACT</text>
      <text x="95" y="78" font-size="15" fill="#eaf4fb">Execute only within</text>
      <text x="95" y="99" font-size="15" fill="#eaf4fb">qualified boundaries</text>
    </g>
    <g transform="translate(935 142)">
      <rect width="190" height="116" rx="18" fill="url(#blue)"/>
      <text x="95" y="48" font-size="22" font-weight="700" fill="white">5. OBSERVE</text>
      <text x="95" y="78" font-size="15" fill="#eaf4fb">Monitor outcomes,</text>
      <text x="95" y="99" font-size="15" fill="#eaf4fb">controls, and unknowns</text>
    </g>
    <g transform="translate(1155 142)">
      <rect width="190" height="116" rx="18" fill="#2f7656"/>
      <text x="95" y="48" font-size="22" font-weight="700" fill="white">6. REQUALIFY</text>
      <text x="95" y="78" font-size="15" fill="#eaf7f0">Reopen affected stages</text>
      <text x="95" y="99" font-size="15" fill="#eaf7f0">when change is material</text>
    </g>
  </g>

  <g stroke="#2f6f9f" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M245 200 H270"/><path d="M465 200 H490"/><path d="M685 200 H710"/>
    <path d="M905 200 H930"/><path d="M1125 200 H1150"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="75" y="316" width="590" height="74" rx="14" fill="#fff0f0" stroke="#c76464" stroke-width="2"/>
    <text x="98" y="346" font-size="18" font-weight="700" fill="#8f2f2f">Mismatch, expiry, or inactive control → BLOCK</text>
    <text x="98" y="372" font-size="15" fill="#6e4141">Do not execute; repair, reselect, or obtain a current authority basis.</text>
    <path d="M370 316 C370 285 370 282 370 265" stroke="#a33a3a" stroke-width="4" fill="none" marker-end="url(#redArrow)"/>

    <rect x="735" y="316" width="590" height="74" rx="14" fill="#eef7f1" stroke="#4f8b69" stroke-width="2"/>
    <text x="758" y="346" font-size="18" font-weight="700" fill="#2f6a49">Material outcome or context change → REOPEN</text>
    <text x="758" y="372" font-size="15" fill="#3f6550">Update the claim and rerun only the affected stages plus dependencies.</text>
    <path d="M1030 316 C1030 285 1250 295 1250 265" stroke="#2f7656" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
