name: Verify frozen Core and scoped reference tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the scoped test dependency
        run: python -m pip install -r Reference/requirements.txt
      - name: Verify exact files and execute local tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B verify_all.py --output-dir "$RUNNER_TEMP/mathgov-results"
